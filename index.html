<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNDERDOGG</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="background"></div>
<div class="scanline"></div>

<div class="container">

    <div class="stream-status offline">
        <span class="dot"></span>
        <span>СТАТУС СТРИМА</span>
        <span class="state">НЕ В ЭФИРЕ</span>
    </div>

    <h1 class="logo">UNDERDOGG</h1>

    <p class="slogan">
        NO FACE.<br>
        NO LIMITS.
    </p>

    <div class="hood">
        <img src="images/hood.png" alt="">
    </div>

    <button class="menu-btn">
        🎁 УЧАСТВОВАТЬ В РОЗЫГРЫШЕ
        <span>›</span>
    </button>

    <button class="menu-btn">
        📊 СТАТИСТИКА РОЗЫГРЫШЕЙ
        <span>›</span>
    </button>

    <button class="menu-btn">
        🔗 ССЫЛКИ НА ПРОЕКТЫ
        <span>›</span>
    </button>

    <button class="menu-btn">
        👤 ПРИГЛАСИТЬ ДРУГА
        <span>›</span>
    </button>

    <div class="footer">
        UNDERDOGG SYSTEM
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
